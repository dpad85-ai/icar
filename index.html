<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="iCar">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>iCar</title>
<style>
:root{
  --bg:#05060a; --text:#fff; --dim:rgba(235,235,245,.6); --dim2:rgba(235,235,245,.38);
  --line:rgba(255,255,255,.08); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --accent:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a; --yellow:#ffd60a;
  --r:30px; --side:88px; --wgt:316px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --wp1:#0b2a5c; --wp2:#06142e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
input,select,button{font:inherit;color:inherit}
input,select{-webkit-user-select:text;user-select:text}
button{background:none;border:0;cursor:pointer}
svg{display:block}
.ico{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* vetro */
.glass{background:rgba(24,25,30,.74);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,.09);box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07)}
.press{transition:transform .14s ease,background .2s}
.press:active{transform:scale(.95)}

#wall{position:fixed;inset:0;background:
  radial-gradient(90% 70% at 15% 0%,var(--wp1) 0%,transparent 70%),
  radial-gradient(80% 60% at 100% 100%,var(--wp2) 0%,transparent 70%),#05060a}
#app{position:fixed;inset:0;display:flex;gap:0;padding:0}

/* ---------- barra laterale ---------- */
#side{width:calc(var(--side) + var(--sal));flex:none;border-radius:0;border:0;border-right:1px solid rgba(255,255,255,.08);box-shadow:none;display:flex;flex-direction:column;align-items:center;padding:calc(var(--sat) + 14px) 0 calc(var(--sab) + 14px) var(--sal);gap:12px}
#sideClock{font-size:23px;font-weight:700;letter-spacing:-.4px}
#sideTemp{font-size:13px;color:var(--dim);margin-top:-6px;min-height:16px}
#recents{flex:1;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center}
#recents .tile{width:62px;border-radius:15px}
.sbtn{width:62px;height:62px;border-radius:18px;background:var(--fill);display:grid;place-items:center}
.sbtn svg{width:30px;height:30px}
#micBtn{background:conic-gradient(from 200deg,#5e5ce6,#bf5af2,#ff375f,#ff9f0a,#30d158,#64d2ff,#5e5ce6);padding:3px}
#micBtn span{width:100%;height:100%;border-radius:15px;background:#111216;display:grid;place-items:center}

#main{flex:1;position:relative;border-radius:0;overflow:hidden;min-width:0;isolation:isolate}
#dash .ov{margin-top:var(--sat)}
#dash #chips,#dash #navBot,#dash #routeCard{margin-top:0;margin-bottom:var(--sab)}
#home,#phone,#settings{padding:var(--sat) var(--sar) var(--sab) 0}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}

/* ---------- mappa ---------- */
#map{position:absolute;inset:0;overflow:hidden;background:#1c1e24;touch-action:none;cursor:grab}
body.day #map{background:#e8e4dc}
#mapLayer{position:absolute;left:0;top:0;will-change:transform}
#gmap{position:absolute;inset:0;display:none;z-index:1}
body.gm #gmap{display:block}
body.gm #mapLayer,body.gm #attrib{display:none}
#typeBtn{color:var(--accent)}
#gmap .gm-style-cc,#gmap .gmnoprint a{font-size:9px}
#mapLayer img.t{position:absolute;width:256px;height:256px;opacity:0;transition:opacity .35s;pointer-events:none;-webkit-user-drag:none}
#mapLayer img.t.on{opacity:1}
body.night #mapLayer.osm img.t{filter:invert(.92) hue-rotate(180deg) brightness(.9) contrast(.88) saturate(.7)}
#routeSvg{position:absolute;pointer-events:none;overflow:visible}
#me{position:absolute;width:0;height:0;transition:left .95s linear,top .95s linear;z-index:3;display:none}
#me i{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;background:#0a84ff;border:4px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.45)}
#me b{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;background:rgba(10,132,255,.14);border:1px solid rgba(10,132,255,.35)}
#me i{display:grid;place-items:center}
#me i svg{width:62%;height:62%;transition:transform .9s linear}
#me.nav i{background:#0a84ff;width:40px;height:40px;left:-20px;top:-20px}
#destPin{position:absolute;width:0;height:0;z-index:2;display:none}
#destPin svg{position:absolute;left:-19px;top:-46px;width:38px;height:46px}
#attrib{position:absolute;right:calc(var(--wgt) + 26px);bottom:6px;font-size:10px;color:rgba(0,0,0,.55);z-index:4;pointer-events:none}
body.night #attrib{color:rgba(255,255,255,.45)}

/* overlay dashboard */
.ov{position:absolute;z-index:5}
#searchBox{left:14px;top:14px;width:min(560px,calc(100% - var(--wgt) - 44px));border-radius:22px;overflow:hidden}
#searchRow{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px}
#searchRow svg{width:22px;height:22px;color:var(--dim);flex:none}
#navInput{flex:1;min-width:0;background:none;border:0;outline:none;font-size:19px;padding:12px 6px}
#navInput::placeholder{color:var(--dim2)}
#searchClear{width:40px;height:40px;border-radius:50%;display:none;place-items:center;color:var(--dim)}
#searchClear svg{width:20px;height:20px}
#sugg{max-height:360px;overflow-y:auto;border-top:1px solid var(--line);display:none}
.sg{display:flex;align-items:center;gap:14px;padding:12px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.sg:last-child{border-bottom:0}
.sg:active{background:var(--fill)}
.sg .di{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--fill2)}
.sg .di svg{width:20px;height:20px}
.sg b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg small{display:block;font-size:14px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg div{min-width:0}

#chips{left:0;right:calc(var(--wgt) + 14px);bottom:0;padding:14px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:12px;border-radius:22px;padding:9px 18px 9px 9px;text-align:left}
.chip .di{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.chip .di{color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.chip .di svg{width:24px;height:24px}
.chip b{display:block;font-size:17px;font-weight:600;white-space:nowrap}
.chip small{display:block;font-size:13px;color:var(--dim);white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.chip.sm .di{background:var(--fill2)}

#mapCtl{right:calc(var(--wgt) + 26px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
#mapCtl button{width:52px;height:52px;border-radius:18px;display:grid;place-items:center}
#mapCtl svg{width:24px;height:24px}
#recenter{color:var(--accent)}
#mapNote{left:50%;top:84px;transform:translateX(-50%);border-radius:16px;padding:10px 16px;font-size:15px;display:none;max-width:60%;text-align:center;line-height:1.35}

/* widget a destra */
#widgets{right:14px;top:14px;bottom:14px;width:var(--wgt);display:flex;flex-direction:column;gap:12px}
.wg{border-radius:26px;padding:16px 18px;overflow:hidden;flex:none}
.wg h4{font-size:13px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:6px}
.wg h4 svg{width:15px;height:15px}
#wSpeed{display:flex;align-items:center;gap:16px;padding:14px 18px}
#gauge{width:118px;height:118px;position:relative;flex:none}
#gauge svg{position:absolute;inset:0;width:100%;height:100%}
#gauge .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#speed{font-size:44px;font-weight:700;letter-spacing:-1.5px;line-height:1}
#gauge small{font-size:12px;color:var(--dim);margin-top:2px}
#wSpeed.over #speed{color:var(--red)}
#limBadge{width:58px;height:58px;border-radius:50%;border:6px solid var(--red);background:#fff;color:#000;display:grid;place-items:center;font-weight:800;font-size:21px}
#limBadge.off{opacity:.25;background:none;color:#fff;border-color:var(--dim2);font-size:13px;font-weight:600}
#spSide{display:flex;flex-direction:column;gap:8px;align-items:center}
#spSide small{font-size:12px;color:var(--dim)}
#wInfo{display:flex;align-items:center;justify-content:space-between}
#clockBig{font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1}
#dateBig{font-size:14px;color:var(--dim);margin-top:4px}
#wxBox{text-align:right}
#wxIcon{font-size:32px;line-height:1}
#wxTemp{font-size:22px;font-weight:600;margin-top:2px}
#wxDesc{font-size:13px;color:var(--dim)}
#wAudio .row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
#wAudio .tile{width:100%;border-radius:16px}
#wTrip .tg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:10px}
#wTrip .tg b{display:block;font-size:24px;font-weight:700;letter-spacing:-.5px}
#wTrip .tg small{font-size:12px;color:var(--dim)}
#tripReset{margin-left:auto;font-size:13px;color:var(--accent);text-transform:none;letter-spacing:0;font-weight:600}

/* navigazione */
#navTop{left:14px;top:14px;width:min(520px,calc(100% - var(--wgt) - 44px));border-radius:28px;padding:18px 20px;display:none}
#navTop .mrow{display:flex;align-items:center;gap:18px}
#manIco{width:78px;height:78px;border-radius:22px;background:var(--accent);display:grid;place-items:center;flex:none}
#manIco svg{width:50px;height:50px;color:#fff;stroke-width:2.4}
#manDist{font-size:42px;font-weight:700;letter-spacing:-1px;line-height:1}
#manText{font-size:20px;font-weight:600;margin-top:6px;line-height:1.25}
#manThen{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:16px;color:var(--dim);display:none;align-items:center;gap:10px}
#manThen svg{width:22px;height:22px;color:#fff}
#navBot{left:14px;bottom:14px;width:min(520px,calc(100% - var(--wgt) - 44px));border-radius:26px;padding:12px 12px 12px 22px;display:none;align-items:center;gap:14px}
#navBot .eta{flex:1;display:flex;gap:22px}
#navBot .eta b{display:block;font-size:26px;font-weight:700;letter-spacing:-.5px}
#navBot .eta small{font-size:13px;color:var(--dim)}
.cbtn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--fill2);flex:none}
.cbtn svg{width:26px;height:26px}
.cbtn.red{background:var(--red)}
#routeCard{left:14px;bottom:14px;width:min(520px,calc(100% - var(--wgt) - 44px));border-radius:28px;padding:20px;display:none}
#routeCard h3{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#routeCard .sub{font-size:15px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#routeCard .big{display:flex;gap:26px;margin:16px 0 18px}
#routeCard .big b{display:block;font-size:30px;font-weight:700;letter-spacing:-.5px}
#routeCard .big small{font-size:13px;color:var(--dim)}
#routeCard .acts{display:flex;gap:10px}
.pbtn{flex:1;border-radius:18px;padding:16px;font-size:18px;font-weight:600;background:var(--fill2);text-align:center}
.pbtn.blue{background:var(--accent)}
.pbtn.green{background:var(--green);color:#000}
body.preview #searchBox,body.preview #chips,body.nav #searchBox,body.nav #chips{display:none}
body.preview #routeCard{display:block}
body.nav #navTop{display:block}
body.nav #navBot{display:flex}
body.nav #wAudio,body.nav #wTrip{display:none}

/* modalità schermo: riquadri / app a metà / solo mappa */
body.lay-map{--wgt:0px}
body.lay-apps{--wgt:min(48%,580px)}
body.lay-map #widgets,body.lay-apps #widgets{display:none}
#appsPanel{right:14px;top:14px;bottom:14px;width:var(--wgt);border-radius:28px;display:none;flex-direction:column;overflow:hidden}
body.lay-apps #appsPanel{display:flex}
#apHead{display:flex;align-items:center;gap:14px;padding:16px 18px 10px}
#apClock{font-size:30px;font-weight:700;letter-spacing:-.5px}
#apDate{font-size:13px;color:var(--dim)}
#apSpeed{margin-left:auto;display:flex;align-items:baseline;gap:4px;padding:8px 14px;border-radius:16px;background:var(--fill)}
#apSpeed b{font-size:26px;font-weight:700}
#apSpeed small{font-size:12px;color:var(--dim)}
#apSpeed.over{background:var(--red)}
#apGrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:16px 8px;padding:8px 16px 16px;align-content:start}
#apGrid .app span{font-size:13px;max-width:100px}
#apGrid .tile{width:min(76px,100%)}
#apFoot{display:flex;gap:10px;padding:10px 16px 16px}
#apFoot button{flex:1}
#miniSpeed{right:14px;top:14px;width:84px;height:84px;border-radius:50%;display:none;flex-direction:column;align-items:center;justify-content:center}
#miniSpeed b{font-size:32px;font-weight:700;line-height:1}
#miniSpeed small{font-size:11px;color:var(--dim)}
#miniSpeed.over{background:var(--red)}
body.lay-map #miniSpeed{display:flex}
body.lay-map #searchBox,body.lay-map #navTop,body.lay-map #routeCard,body.lay-map #navBot{width:min(560px,calc(100% - 140px))}
#layBtn{color:var(--accent)}

/* ---------- home ---------- */
#home{background:transparent}
#pages{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#pages::-webkit-scrollbar{display:none}
.page{flex:none;width:100%;height:100%;scroll-snap-align:start;display:grid;padding:36px 34px 8px;gap:20px 12px;align-content:center;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;transition:transform .14s}
.app:active{transform:scale(.9)}
.tile{width:min(112px,100%);aspect-ratio:1;border-radius:23.5%;display:grid;place-items:center;position:relative;overflow:hidden;color:#fff;
  box-shadow:0 10px 24px rgba(0,0,0,.38),0 2px 4px rgba(0,0,0,.25)}
.tile:before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 0 0 1px rgba(255,255,255,.14),inset 0 -2px 6px rgba(0,0,0,.18);pointer-events:none;z-index:2}
.tile:after{content:"";position:absolute;left:-10%;right:-10%;top:-38%;height:78%;border-radius:50%;background:radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.28),rgba(255,255,255,0) 70%);pointer-events:none}
.tile svg{width:56%;height:56%;position:relative;z-index:1;filter:drop-shadow(0 1.5px 1.5px rgba(0,0,0,.22))}
.gl{display:block}
.tile .lt{font-size:34px;font-weight:700;position:relative;z-index:1}
.app span{font-size:16px;font-weight:500;text-align:center;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.7)}
#dots{display:flex;gap:9px;justify-content:center;padding:6px 0 18px}
#dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);transition:.2s}
#dots i.on{background:#fff;width:22px;border-radius:4px}

/* ---------- pagine interne ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:18px 22px 8px}
.topbar h2{font-size:30px;font-weight:800;flex:1;letter-spacing:-.5px}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:18px;padding:8px 10px 8px 4px}
.back svg{width:24px;height:24px}
.seg{display:flex;background:var(--fill);border-radius:14px;padding:3px}
.seg button{padding:10px 20px;border-radius:11px;font-size:16px;font-weight:600;color:var(--dim)}
.seg button.on{background:rgba(255,255,255,.18);color:#fff}
#phoneBody{flex:1;min-height:0;padding:10px 22px 22px;display:flex}
#favs{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;align-content:start;overflow-y:auto}
.fav{border-radius:24px;display:flex;align-items:center;overflow:hidden}
.favMain{flex:1;min-width:0;display:flex;align-items:center;gap:14px;text-align:left;padding:16px}
.favMain div{min-width:0}
.favMain b{font-size:19px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.favMain small{display:block;color:var(--dim);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.favMain:active,.favMsg:active{background:var(--fill)}
.favMsg{width:64px;align-self:stretch;display:grid;place-items:center;border-left:1px solid var(--line);color:var(--green)}
.favMsg svg{width:26px;height:26px}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(160deg,#a1a1a6,#636366);display:grid;place-items:center;font-size:22px;font-weight:700;flex:none}
#keypad{flex:1;display:flex;gap:40px;align-items:center;justify-content:center}
#phoneBody{flex-direction:column;gap:12px}
.phList{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.phTools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.phTools input{flex:1;min-width:200px;background:var(--fill);border:0;border-radius:14px;padding:13px 16px;font-size:17px;outline:none}
.ct{display:flex;align-items:center;border-radius:18px;overflow:hidden}
.ct .favMain{padding:10px 14px}
.ct .avatar{width:46px;height:46px;font-size:19px}
.ctBtn{width:58px;align-self:stretch;display:grid;place-items:center;border-left:1px solid var(--line)}
.ctBtn svg{width:24px;height:24px}
.ctBtn.star.on{color:var(--yellow)}
.ctBtn:active{background:var(--fill)}
.letter{font-size:13px;font-weight:700;color:var(--dim);padding:8px 6px 0}
.phEmpty{margin:auto;max-width:560px;text-align:center;color:var(--dim);font-size:16px;line-height:1.5}
.phEmpty b{display:block;color:#fff;font-size:22px;margin-bottom:8px}
.phEmpty .pbtn{display:block;width:100%;margin-top:12px;color:#fff}
.native{display:flex;gap:10px}
.native .pbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;padding:14px}
.native svg{width:22px;height:22px}
.rc small.miss{color:var(--red)}
#kpDisplay{min-width:260px;text-align:center}
#kpNum{font-size:42px;font-weight:300;letter-spacing:2px;min-height:54px;word-break:break-all}
#kpGrid{display:grid;grid-template-columns:repeat(3,80px);gap:16px}
.key{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.14);font-size:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.key small{font-size:10px;letter-spacing:2px;color:#ddd;margin-top:2px}
.key:active{background:rgba(255,255,255,.35)}
.callBtn{width:80px;height:80px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:18px auto 0}
.callBtn svg{width:34px;height:34px}
.delBtn{margin-top:12px;color:var(--dim);font-size:16px;padding:8px}

#setBody{flex:1;overflow-y:auto;padding:6px 22px 34px;-webkit-overflow-scrolling:touch}
.group{border-radius:22px;margin-bottom:24px;overflow:hidden}
.gtitle{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin:0 8px 8px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);min-height:58px}
.row:last-child{border-bottom:0}
.row label{flex:1;font-size:17px}
.row label small{color:var(--dim);font-size:13px}
.row input[type=text],.row input[type=tel]{flex:2;background:var(--fill);border:0;border-radius:12px;padding:11px 12px;font-size:16px;outline:none;min-width:0}
.row select{background:var(--fill);border:0;border-radius:12px;padding:10px 12px;font-size:16px;max-width:55%}
.btn{background:var(--fill);border-radius:12px;padding:10px 16px;font-size:16px;font-weight:600;white-space:nowrap}
.btn.blue{background:var(--accent)}
.btn.red{color:var(--red)}
.sw{position:relative;width:52px;height:32px;flex:none}
.row label.sw{flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:rgba(120,120,128,.32);border-radius:20px;transition:.2s}
.sw span:before{content:"";position:absolute;width:28px;height:28px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.sw input:checked+span{background:var(--green)}
.sw input:checked+span:before{transform:translateX(20px)}
.mini{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 6px rgba(0,0,0,.25)}
.mini svg{width:24px;height:24px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.mini .lt{font-size:18px;font-weight:700}
.wps{display:flex;gap:10px;flex-wrap:wrap}
.wps button{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.wps button.on{border-color:#fff}
.note{color:var(--dim);font-size:14px;line-height:1.45;padding:0 8px 10px}

/* catalogo app */
#cat{position:fixed;inset:0;z-index:45;display:none;padding:calc(var(--sat) + 24px) calc(var(--sar) + 24px) calc(var(--sab) + 24px) calc(var(--sal) + 24px);background:rgba(0,0,0,.45)}
#cat.on{display:flex}
#catBox{flex:1;border-radius:32px;display:flex;flex-direction:column;overflow:hidden;background:rgba(22,23,28,.92)}
#catHead{display:flex;gap:12px;align-items:center;padding:18px 20px}
#catHead h2{font-size:26px;font-weight:800;flex:1}
#catSearch{background:var(--fill);border:0;border-radius:14px;padding:12px 14px;font-size:17px;outline:none;width:280px}
#catBody{flex:1;overflow-y:auto;padding:0 20px 24px}
.catGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:22px}
.catItem{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.05);text-align:left}
.catItem b{flex:1;font-size:17px;font-weight:600}
.catItem .add{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);flex:none}
.catItem .add svg{width:18px;height:18px}
.catItem.in .add{background:var(--green)}

/* voce */
#voice{position:fixed;inset:0;z-index:48;display:none;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--sab) + 40px);background:linear-gradient(transparent 40%,rgba(0,0,0,.65))}
#voice.on{display:flex}
#vBox{border-radius:34px;padding:22px 30px;display:flex;align-items:center;gap:22px;min-width:min(620px,90vw);max-width:90vw}
#orb{width:70px;height:70px;border-radius:50%;flex:none;background:conic-gradient(from 0deg,#5e5ce6,#bf5af2,#ff375f,#ff9f0a,#64d2ff,#5e5ce6);animation:spin 2.4s linear infinite;filter:blur(1px);box-shadow:0 0 40px rgba(191,90,242,.6)}
#voice.idle #orb{animation:none;opacity:.6}
@keyframes spin{to{transform:rotate(360deg)}}
#vText{font-size:24px;font-weight:600;line-height:1.3}
#vHint{font-size:15px;color:var(--dim);margin-top:6px;line-height:1.4}

/* toast e finestre */
#toast{position:fixed;left:50%;top:calc(var(--sat) + 22px);transform:translateX(-50%) translateY(-20px);border-radius:18px;padding:14px 22px;font-size:16px;opacity:0;transition:.25s;pointer-events:none;z-index:70;max-width:80vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:50}
#modal.on{display:grid}
#modalBox{border-radius:28px;padding:24px;width:min(460px,90vw);background:rgba(30,31,36,.92)}
#modalBox h4{font-size:21px;margin-bottom:14px}
#modalBox p{color:var(--dim);font-size:15px;line-height:1.45;margin:-6px 0 14px}
#modalBox input{width:100%;background:var(--fill);border:0;border-radius:14px;padding:14px;font-size:17px;margin-bottom:10px;outline:none}
#modalBox .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
#dimLayer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60;transition:opacity 1.5s}
body.night.dim #dimLayer{opacity:.28}

/* ---------- verticale ---------- */
@media (orientation:portrait){
  :root{--wgt:0px}
  #app{flex-direction:column-reverse}
  #side{width:auto;height:calc(86px + var(--sab));flex-direction:row;padding:0 calc(var(--sar) + 18px) var(--sab) calc(var(--sal) + 18px);gap:16px;border-right:0;border-top:1px solid rgba(255,255,255,.08)}
  #home,#phone,#settings{padding:var(--sat) var(--sar) 0 var(--sal)}
  #dash #chips,#dash #navBot,#dash #routeCard{margin-bottom:0}
  #sideTemp{margin:0}
  #recents{flex-direction:row}
  :root{--bot:164px}
  body.lay-map{--bot:0px} body.lay-apps{--bot:calc(46% + 14px)}
  #widgets{left:14px;right:14px;top:auto;bottom:14px;width:auto;height:150px;flex-direction:row}
  #appsPanel{left:14px;right:14px;top:auto;bottom:14px;width:auto;height:46%}
  body.lay-apps{--wgt:0px}
  #widgets .wg{flex:1;min-width:0}
  #wTrip,#wInfo{display:none}
  #gauge{width:100px;height:100px}
  #chips{right:0;bottom:var(--bot)}
  #mapCtl{right:14px;top:auto;bottom:calc(var(--bot) + 80px);transform:none}
  #attrib{right:14px;bottom:calc(var(--bot) + 4px)}
  #searchBox,#navTop,#routeCard,#navBot{width:calc(100% - 28px)}
  #routeCard,#navBot{bottom:calc(var(--bot) + 14px)}
  body.lay-map #searchBox,body.lay-map #navTop,body.lay-map #routeCard,body.lay-map #navBot{width:calc(100% - 128px)}
  #keypad{flex-direction:column;gap:12px}
}
</style>

let toastT;
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>e.classList.remove('on'),2600); }
function openURL(u){
  try{ window.location.href=u; }catch(e){}
  setTimeout(()=>{ if(document.visibilityState==='visible') toast('Se non si apre nulla, controlla che l’app sia installata sull’iPad'); },1800);
}
const pad2=n=>String(n).padStart(2,'0');
function hm(d){ let h=d.getHours(); if(!S.h24) h=h%12||12; return h+':'+pad2(d.getMinutes()); }
function fmtDist(m){ if(m<950) return (m<100?Math.max(5,Math.round(m/5)*5):Math.round(m/10)*10)+' m'; return (m/1000).toFixed(m<9500?1:0).replace('.',',')+' km'; }
function fmtDur(s){ const m=Math.max(1,Math.round(s/60)); if(m<60) return m+' min'; return Math.floor(m/60)+' h '+pad2(m%60); }
function spokenDist(m){ if(m<950){ const r=m<100?Math.round(m/10)*10:Math.round(m/50)*50; return r+' metri'; } const k=Math.round(m/100)/10; return (k===1?'un chilometro':String(k).replace('.',',')+' chilometri'); }
function kmBetween(a,b){ const R=6371, dl=(b.lat-a.lat)*Math.PI/180, dn=(b.lon-a.lon)*Math.PI/180;
  const x=Math.sin(dl/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.min(1,Math.sqrt(x))); }
function bearing(a,b){ const f1=a.lat*Math.PI/180,f2=b.lat*Math.PI/180,dl=(b.lon-a.lon)*Math.PI/180;
  const y=Math.sin(dl)*Math.cos(f2), x=Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl); return (Math.atan2(y,x)*180/Math.PI+360)%360; }
async function getJSON(u,ms){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms||12000);
  try{ const r=await fetch(u,{signal:c.signal}); if(!r.ok) throw new Error('http '+r.status); return await r.json(); } finally{ clearTimeout(t); } }

/* ================= app ================= */
function allApps(){
  const custom=S.custom.map(c=>({id:c.id,name:c.name,icon:c.icon||'link',color:c.color||'gray',act:{url:c.url},custom:true}));
  const list=BUILTIN.concat(custom);
  const ord=S.order.filter(id=>list.some(a=>a.id===id));
  list.forEach(a=>{ if(!ord.includes(a.id)) ord.push(a.id); });
  const r=ord.map(id=>list.find(a=>a.id===id));
  // "Aggiungi app" e Impostazioni sempre in fondo
  return r.filter(a=>a.id!=='addapp'&&a.id!=='set').concat(r.filter(a=>a.id==='addapp'||a.id==='set'));
}
const visibleApps=()=>allApps().filter(a=>!S.hidden.includes(a.id));
const appById=id=>allApps().find(a=>a.id===id);
function tileHTML(a){ return '<div class="tile" style="background:'+(G[a.color]||G.gray)+(a.color==='white'?';color:#1c1c1e':'')+'">'+gly(a.icon)+'</div>'; }
function launch(a){
  if(!a) return;
  if(!['set','dash','addapp'].includes(a.id)){ S.recent=[a.id].concat(S.recent.filter(x=>x!==a.id)).slice(0,3); save(); renderRecents(); }
  const act=a.act;
  if(act.view) return show(act.view);
  if(act.catalog) return openCatalog();
  if(act.search) return openURL(NAVS[S.nav].q(act.search));
  if(act.url) return openURL(act.url);
}
function call(num,name){ const n=String(num).replace(/[^\d+*#]/g,''); if(!n) return toast('Nessun numero');
  if(!name){ const f=findByNumber(n); if(f) name=f; }
  S.calls=[{n:name||'',num:n,t:Date.now()}].concat(S.calls||[]).slice(0,40); save();
  openURL((S.call==='facetime'?'facetime-audio:':'tel:')+n); }
function normNum(x){ return String(x||'').replace(/[^\d+]/g,'').replace(/^\+39/,'').replace(/^0039/,''); }
function findByNumber(n){ const k=normNum(n); if(!k) return '';
  const f=S.contacts.find(c=>normNum(c.num)===k); if(f) return f.name;
  const b=(S.book||[]).find(c=>c.nums.some(x=>normNum(x.v)===k)); return b?b.n:''; }
function sms(num){ const n=String(num).replace(/[^\d+]/g,''); if(n) openURL('sms:'+n); }

/* ================= viste ================= */
let current='';
function show(v){
  current=v;
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id===v));
  $('#toggleView').innerHTML=svg(v==='dash'?'grid':'map');
  if(v==='dash'){ renderDash(); requestAnimationFrame(()=>{ layoutFocus(); mapReset(); }); }
  if(v==='phone') renderPhone();
  if(v==='settings') renderSettings();
  if(v==='home') renderHome();
  requestWake();
}
$('#toggleView').onclick=()=>show(current==='dash'?'home':'dash');
document.querySelectorAll('[data-go]').forEach(b=>{ b.innerHTML=svg('back')+'Mappa'; b.onclick=()=>show(b.dataset.go); });

function renderRecents(){
  $('#recents').innerHTML=S.recent.map(appById).filter(Boolean).slice(0,3)
    .map(a=>'<button class="app" data-id="'+a.id+'" aria-label="'+esc(a.name)+'">'+tileHTML(a)+'</button>').join('');
  $('#recents').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>launch(appById(b.dataset.id)));
}

/* ---------- home ---------- */
function renderHome(){
  const box=$('#pages'); const w=box.clientWidth||900, h=box.clientHeight||600;
  const cols=Math.max(3,Math.min(6,Math.floor((w-40)/170))), rows=Math.max(2,Math.min(4,Math.floor((h-20)/180)));
  const per=cols*rows, apps=visibleApps(), pages=[];
  for(let i=0;i<apps.length;i+=per) pages.push(apps.slice(i,i+per));
  box.innerHTML=pages.map(p=>'<div class="page" style="grid-template-columns:repeat('+cols+',1fr);grid-template-rows:repeat('+rows+',auto)">'+
    p.map(a=>'<button class="app" data-id="'+a.id+'">'+tileHTML(a)+'<span>'+esc(a.name)+'</span></button>').join('')+'</div>').join('');
  box.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>launch(appById(b.dataset.id)));
  $('#dots').innerHTML=pages.length>1?pages.map((_,i)=>'<i'+(i===0?' class="on"':'')+'></i>').join(''):'';
  box.scrollLeft=0;
}
$('#pages').addEventListener('scroll',()=>{ const b=$('#pages'), i=Math.round(b.scrollLeft/b.clientWidth);
  document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('on',k===i)); },{passive:true});

/* ================= MAPPA (tessere, fluida) ================= */
const TS=256;
const lon2x=(lon,z)=>(lon+180)/360*TS*Math.pow(2,z);
function lat2y(lat,z){ const s=Math.sin(Math.max(-85,Math.min(85,lat))*Math.PI/180); return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*TS*Math.pow(2,z); }
const x2lon=(x,z)=>x/(TS*Math.pow(2,z))*360-180;
function y2lat(y,z){ const n=Math.PI-2*Math.PI*y/(TS*Math.pow(2,z)); return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))); }
const M={z:6,lat:42.5,lon:12.5,follow:true,zManual:false,ox:0,oy:0,tiles:{},style:'',fx:0,fy:0};
if(S.lastPos){ M.lat=S.lastPos.lat; M.lon=S.lastPos.lon; M.z=15; }
const mapEl=$('#map'), layer=$('#mapLayer');
function tileURL(z,x,y){ const n=Math.pow(2,z); x=((x%n)+n)%n;
  return 'https://tile.openstreetmap.org/'+z+'/'+x+'/'+y+'.png'; }
function mapProvider(){ layer.classList.add('osm'); $('#attrib').textContent='© OpenStreetMap'; }
function layoutFocus(){
  const w=mapEl.clientWidth||900, h=mapEl.clientHeight||700, port=h>w;
  const L=S.layout||'wgt', panel=L==='apps'?$('#appsPanel'):L==='wgt'?$('#widgets'):null;
  const wg=port||!panel?0:((panel.offsetWidth||316)+28);
  const bottom=port&&panel?(panel.offsetHeight+28):0;
  M.fx=(w-wg)/2;
  M.fy=document.body.classList.contains('nav') ? (h-bottom)*0.66 : (h-bottom)/2;
}
function mapReset(){
  if(GM.on){ gmSync(false); return; }
  mapProvider();
  layer.querySelectorAll('img.t').forEach(i=>i.remove()); M.tiles={};
  M.ox=Math.round(lon2x(M.lon,M.z)); M.oy=Math.round(lat2y(M.lat,M.z));
  mapDraw(false);
}
function mapDraw(anim){
  if(current!=='dash') return;
  if(GM.on){ gmSync(anim); return; }
  const w=mapEl.clientWidth||900, h=mapEl.clientHeight||700, cx=lon2x(M.lon,M.z), cy=lat2y(M.lat,M.z);
  if(!M.fx) layoutFocus();
  const fx=M.fx, fy=M.fy;
  layer.style.transition=anim?'transform .95s linear':'none';
  layer.style.transform='translate3d('+(fx-(cx-M.ox))+'px,'+(fy-(cy-M.oy))+'px,0)';
  const n=Math.pow(2,M.z);
  const x0=Math.floor((cx-fx)/TS)-1, x1=Math.floor((cx+w-fx)/TS)+1, y0=Math.max(0,Math.floor((cy-fy)/TS)-1), y1=Math.min(n-1,Math.floor((cy+h-fy)/TS)+1);
  const keep={};
  for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++){
    const k=x+'/'+y; keep[k]=1;
    if(!M.tiles[k]){ const im=new Image(); im.className='t'; im.draggable=false; im.alt='';
      im.style.left=(x*TS-M.ox)+'px'; im.style.top=(y*TS-M.oy)+'px';
      im.onload=()=>im.classList.add('on'); im.src=tileURL(M.z,x,y); layer.insertBefore(im,layer.firstChild); M.tiles[k]=im; }
  }
  for(const k in M.tiles){ if(!keep[k]){ const p=k.split('/').map(Number); if(p[0]<x0-3||p[0]>x1+3||p[1]<y0-3||p[1]>y1+3){ M.tiles[k].remove(); delete M.tiles[k]; } } }
  placeMe(); drawRoute();
  $('#recenter').style.display=M.follow&&!M.zManual?'none':'grid';
}
function placeMe(){
  if(GM.on){ gmMarkers(); return; }
  const me=$('#me'); if(!pos){ me.style.display='none'; return; }
  me.style.display='block';
  me.style.left=(lon2x(pos.lon,M.z)-M.ox)+'px'; me.style.top=(lat2y(pos.lat,M.z)-M.oy)+'px';
  const acc=Math.min(400,pos.acc||0), mpp=156543*Math.cos(pos.lat*Math.PI/180)/Math.pow(2,M.z), r=Math.max(18,acc/mpp);
  const b=me.querySelector('b'); b.style.width=b.style.height=(2*r)+'px'; b.style.left=b.style.top=(-r)+'px'; b.style.display=acc>25?'block':'none';
  const ii=me.querySelector('i'); let a=ii.querySelector('svg');
  if(pos.heading!=null && !isNaN(pos.heading)){ if(!a){ ii.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 2.5 19.5 20.5 12 16.5 4.5 20.5z" fill="#fff"/></svg>'; a=ii.querySelector('svg'); } a.style.transform='rotate('+Math.round(pos.heading)+'deg)'; }
  else if(a) ii.innerHTML='';
  me.classList.toggle('nav',NAV.active);
}
function drawRoute(){
  if(GM.on){ gmRoute(); return; }
  const sv=$('#routeSvg'), pin=$('#destPin');
  if(!NAV.geom){ sv.style.display='none'; pin.style.display='none'; return; }
  const w=mapEl.clientWidth||900, h=mapEl.clientHeight||700, cx=lon2x(M.lon,M.z)-M.ox, cy=lat2y(M.lat,M.z)-M.oy;
  const L=cx-1.5*w, T=cy-1.5*h;
  sv.style.display='block'; sv.style.left=L+'px'; sv.style.top=T+'px'; sv.setAttribute('width',3*w); sv.setAttribute('height',3*h);
  sv.setAttribute('viewBox','0 0 '+(3*w)+' '+(3*h));
  let d='', last=null; const start=NAV.active?Math.max(0,NAV.si):0;
  if(NAV.active && NAV.snap) d='M'+(NAV.snap.x-L).toFixed(1)+' '+(NAV.snap.y-T).toFixed(1);
  for(let i=start;i<NAV.geom.length;i++){ const g=NAV.geom[i]; const x=lon2x(g[0],M.z)-M.ox-L, y=lat2y(g[1],M.z)-M.oy-T;
    if(last && Math.abs(x-last[0])<1.5 && Math.abs(y-last[1])<1.5 && i<NAV.geom.length-1) continue;
    d+=(d?'L':'M')+x.toFixed(1)+' '+y.toFixed(1); last=[x,y]; }
  sv.innerHTML='<path d="'+d+'" fill="none" stroke="#0a3d91" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="'+d+'" fill="none" stroke="#2f8bff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>';
  const ds=NAV.dest; pin.style.display='block';
  pin.style.left=(lon2x(ds.lon,M.z)-M.ox)+'px'; pin.style.top=(lat2y(ds.lat,M.z)-M.oy)+'px';
  if(!pin.innerHTML) pin.innerHTML='<svg viewBox="0 0 38 46"><path d="M19 45s-16-14.5-16-26a16 16 0 0 1 32 0c0 11.5-16 26-16 26z" fill="#ff375f" stroke="#fff" stroke-width="2.5"/><circle cx="19" cy="19" r="6" fill="#fff"/></svg>';
  if(NAV.snap) NAV.snap=null;
}
/* ================= GOOGLE MAPS (con chiave personale) ================= */
const GM={on:false,map:null,me:null,arrow:null,dest:null,line:null,casing:null,geomRef:null,prog:false,loading:false};
const GM_NIGHT=[{elementType:'geometry',stylers:[{color:'#1d2633'}]},{elementType:'labels.text.stroke',stylers:[{color:'#1d2633'}]},{elementType:'labels.text.fill',stylers:[{color:'#8a94a6'}]},
 {featureType:'road',elementType:'geometry',stylers:[{color:'#38414e'}]},{featureType:'road',elementType:'geometry.stroke',stylers:[{color:'#212a37'}]},{featureType:'road',elementType:'labels.text.fill',stylers:[{color:'#9ca5b3'}]},
 {featureType:'road.highway',elementType:'geometry',stylers:[{color:'#5b5f6b'}]},{featureType:'water',elementType:'geometry',stylers:[{color:'#0f1a2b'}]},{featureType:'poi',elementType:'labels.icon',stylers:[{visibility:'off'}]},{featureType:'transit',stylers:[{visibility:'off'}]}];
function gmLoad(){
  const k=(S.gKey||'').trim(); if(!k||GM.loading) return; GM.loading=true;
  window.__icarGm=()=>{ try{ gmInit(); }catch(e){ GM.on=false; document.body.classList.remove('gm'); toast('Google Maps non disponibile, uso OpenStreetMap'); } };
  window.gm_authFailure=()=>{ GM.on=false; document.body.classList.remove('gm'); renderType(); if(current==='dash') mapReset(); toast('Chiave Google Maps non valida: controlla la chiave e le restrizioni'); };
  const sc=document.createElement('script');
  sc.src='https://maps.googleapis.com/maps/api/js?key='+enc(k)+'&callback=__icarGm&language=it&region=IT&v=weekly&loading=async';
  sc.async=true; sc.onerror=()=>{ GM.loading=false; toast('Google Maps non raggiungibile, uso OpenStreetMap'); };
  document.head.appendChild(sc);
}
function gmInit(){
  const g=google.maps;
  GM.map=new g.Map($('#gmap'),{center:{lat:M.lat,lng:M.lon},zoom:M.z,disableDefaultUI:true,gestureHandling:'greedy',clickableIcons:false,keyboardShortcuts:false,
    mapTypeId:S.mtype==='hybrid'?'hybrid':'roadmap',backgroundColor:'#1c1e24',tilt:0,styles:M.style==='night'?GM_NIGHT:null});
  GM.map.addListener('dragstart',()=>{ M.follow=false; $('#recenter').style.display='grid'; });
  GM.map.addListener('zoom_changed',()=>{ if(GM.prog) return; const z=GM.map.getZoom(); if(z!=null && z!==M.z){ M.z=z; M.zManual=true; $('#recenter').style.display='grid'; } });
  GM.map.addListener('idle',()=>{ if(!M.follow){ const c=GM.map.getCenter(); if(c){ M.lat=c.lat(); M.lon=c.lng(); } } });
  GM.on=true; document.body.classList.add('gm'); renderType();
  if(current==='dash'){ layoutFocus(); gmSync(false); }
}
function gmCenter(){
  // centro della mappa spostato in modo che la posizione cada nel punto di fuoco (non sotto i riquadri)
  const w=mapEl.clientWidth||900, h=mapEl.clientHeight||700; if(!M.fx) layoutFocus();
  const cx=lon2x(M.lon,M.z)+(w/2-M.fx), cy=lat2y(M.lat,M.z)+(h/2-M.fy);
  return {lat:y2lat(cy,M.z),lng:x2lon(cx,M.z)};
}
function gmSync(anim){
  if(!GM.map) return;
  GM.prog=true;
  const c=gmCenter();
  if(GM.map.getZoom()!==M.z || !anim) GM.map.moveCamera({center:c,zoom:M.z}); else GM.map.panTo(c);
  setTimeout(()=>{GM.prog=false;},50);
  gmMarkers(); gmRoute();
  $('#recenter').style.display=M.follow&&!M.zManual?'none':'grid';
}
function gmMarkers(){
  const g=window.google&&google.maps; if(!g||!GM.map) return;
  if(!pos){ if(GM.me) GM.me.setMap(null); if(GM.arrow) GM.arrow.setMap(null); return; }
  const ll={lat:pos.lat,lng:pos.lon};
  if(!GM.me) GM.me=new g.Marker({map:GM.map,zIndex:900,clickable:false,icon:{path:g.SymbolPath.CIRCLE,scale:12,fillColor:'#0a84ff',fillOpacity:1,strokeColor:'#ffffff',strokeWeight:4}});
  GM.me.setMap(GM.map); GM.me.setPosition(ll);
  if(pos.heading!=null && !isNaN(pos.heading)){
    if(!GM.arrow) GM.arrow=new g.Marker({map:GM.map,zIndex:901,clickable:false});
    GM.arrow.setIcon({path:'M0 -7 5 6 0 3 -5 6z',scale:1.3,fillColor:'#ffffff',fillOpacity:1,strokeWeight:0,rotation:pos.heading,anchor:new g.Point(0,0)});
    GM.arrow.setMap(GM.map); GM.arrow.setPosition(ll);
  } else if(GM.arrow) GM.arrow.setMap(null);
}
function gmRoute(){
  const g=window.google&&google.maps; if(!g||!GM.map) return;
  if(!NAV.geom){ [GM.line,GM.casing,GM.dest].forEach(o=>o&&o.setMap(null)); GM.geomRef=null; return; }
  const start=NAV.active?Math.max(0,NAV.si):0;
  const path=NAV.geom.slice(start).map(p=>({lat:p[1],lng:p[0]}));
  if(NAV.active && pos) path.unshift({lat:pos.lat,lng:pos.lon});
  if(!GM.casing) GM.casing=new g.Polyline({strokeColor:'#0a3d91',strokeOpacity:.6,strokeWeight:13,zIndex:10,clickable:false});
  if(!GM.line) GM.line=new g.Polyline({strokeColor:'#2f8bff',strokeOpacity:1,strokeWeight:8,zIndex:11,clickable:false});
  GM.casing.setPath(path); GM.line.setPath(path); GM.casing.setMap(GM.map); GM.line.setMap(GM.map);
  if(!GM.dest) GM.dest=new g.Marker({clickable:false,zIndex:800});
  GM.dest.setPosition({lat:NAV.dest.lat,lng:NAV.dest.lon}); GM.dest.setMap(GM.map);
}
function gmStyle(){ if(GM.map) GM.map.setOptions({styles:M.style==='night'?GM_NIGHT:null}); }

// trascina la mappa
(function(){
  let drag=null, moved=false, lastTap=0;
  mapEl.addEventListener('pointerdown',e=>{ if(GM.on) return; drag={x:e.clientX,y:e.clientY,cx:lon2x(M.lon,M.z),cy:lat2y(M.lat,M.z)}; moved=false; mapEl.setPointerCapture(e.pointerId); });
  mapEl.addEventListener('pointermove',e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(!moved && Math.hypot(dx,dy)<6) return; moved=true; M.follow=false;
    M.lon=x2lon(drag.cx-dx,M.z); M.lat=y2lat(drag.cy-dy,M.z); mapDraw(false); });
  const end=e=>{ if(!drag) return; drag=null;
    if(!moved){ const now=Date.now(); if(now-lastTap<320){ zoomBy(1); } lastTap=now; }
    else if(Math.abs(M.ox-lon2x(M.lon,M.z))>4000||Math.abs(M.oy-lat2y(M.lat,M.z))>4000) mapReset(); };
  mapEl.addEventListener('pointerup',end); mapEl.addEventListener('pointercancel',end);
})();
function zoomBy(d){ const z=Math.max(4,Math.min(19,M.z+d)); if(z===M.z) return; M.z=z; M.zManual=true; mapReset(); }
$('#zoomIn').innerHTML=svg('plus'); $('#zoomOut').innerHTML=svg('minus'); $('#recenter').innerHTML=svg('locate');
$('#zoomIn').onclick=()=>zoomBy(1); $('#zoomOut').onclick=()=>zoomBy(-1);
$('#recenter').onclick=()=>{ M.follow=true; M.zManual=false; if(pos){ M.lat=pos.lat; M.lon=pos.lon; M.z=autoZoom(); } mapReset(); };
function autoZoom(){
  const k=pos?pos.kmh:0;
  if(NAV.active && NAV.nextDist!=null && NAV.nextDist<400) return 17;
  return k>100?14:k>65?15:k>30?16:17;
}
function fitBounds(pts){
  const w=mapEl.clientWidth||900, h=mapEl.clientHeight||700, port=h>w;
  const aw=(port?w:M.fx*2)-80, ah=(port?h-420:h-300);
  let la0=90,la1=-90,lo0=180,lo1=-180; pts.forEach(p=>{ la0=Math.min(la0,p[1]);la1=Math.max(la1,p[1]);lo0=Math.min(lo0,p[0]);lo1=Math.max(lo1,p[0]); });
  let z=17; while(z>3 && (lon2x(lo1,z)-lon2x(lo0,z)>aw || lat2y(la0,z)-lat2y(la1,z)>Math.max(200,ah))) z--;

let pos=null, geoOn=false, lastWx=0, lastBeep=0, prevPt=null;
function startGeo(){
  if(geoOn) return;
  if(!navigator.geolocation){ mapNote('Questo dispositivo non fornisce la posizione'); return; }
  geoOn=true;
  if(!pos) mapNote('Cerco la tua posizione… se te lo chiede, tocca <b>Consenti</b>');
  try{ navigator.geolocation.watchPosition(onPos,err=>{
      geoOn=false; $('#speed').textContent='--';
      mapNote(err&&err.code===1?'Posizione non consentita: Impostazioni iPad → Privacy → Localizzazione → Siti web di Safari':'Posizione non disponibile al momento');
    },{enableHighAccuracy:true,maximumAge:1000,timeout:30000}); }catch(e){}
}
function onPos(p){
  const c=p.coords, now=Date.now();
  let kmh=(c.speed!=null&&c.speed>=0)?c.speed*3.6:null;
  const pt={lat:c.latitude,lon:c.longitude,t:now};
  let head=(c.heading!=null&&!isNaN(c.heading)&&c.speed>0.8)?c.heading:null;
  if(prevPt){ const d=kmBetween(prevPt,pt)*1000, dt=(now-prevPt.t)/1000;
    if(kmh==null && dt>0 && c.accuracy<=40) kmh=d/dt*3.6;
    if(head==null && d>6) head=bearing(prevPt,pt); }
  if(head==null && pos) head=pos.heading;
  if(!prevPt || kmBetween(prevPt,pt)*1000>4 || now-prevPt.t>5000) prevPt=pt;
  pos={lat:pt.lat,lon:pt.lon,acc:c.accuracy||0,kmh:Math.max(0,Math.round(kmh||0)),heading:head,t:now};
  mapNote(pos.acc>150?'Posizione approssimativa (±'+Math.round(pos.acc)+' m): l’iPad solo Wi-Fi non ha il GPS':'');
  if(!S.lastPos || kmBetween(S.lastPos,pos)>0.2){ S.lastPos={lat:+pos.lat.toFixed(5),lon:+pos.lon.toFixed(5)}; save(); }
  updateSpeed(); tripTick();
  if(now-lastWx>15*60*1000){ lastWx=now; weather(pos.lat,pos.lon); }
  NAV.update();
  if(current==='dash'){
    if(M.follow){ M.lat=pos.lat; M.lon=pos.lon; const z=M.zManual?M.z:autoZoom();
      if(z!==M.z){ M.z=z; mapReset(); } else if(Math.abs(lon2x(M.lon,M.z)-M.ox)>6000||Math.abs(lat2y(M.lat,M.z)-M.oy)>6000) mapReset(); else mapDraw(true); }
    else placeMe();
  }
}

function tripNew(){ return {dist:0,moving:0,max:0,start:null,stopAt:null,lastPt:null}; }
let T=S.trip||tripNew(), tripSaveT=0;
function tripTick(){
  const now=Date.now(), k=pos.kmh;
  if(pos.acc<=50){
    if(T.lastPt){ const d=kmBetween(T.lastPt,pos), dt=(now-T.lastPt.t)/1000;
      if(dt>0 && dt<120 && d*3600/dt<250 && d>0.004){ T.dist+=d; T.lastPt={lat:pos.lat,lon:pos.lon,t:now}; if(k>3) T.moving+=dt; }
      else if(dt>=120) T.lastPt={lat:pos.lat,lon:pos.lon,t:now};
    } else T.lastPt={lat:pos.lat,lon:pos.lon,t:now};
  }
  if(k>8 && !T.start) T.start=now;
  T.max=Math.max(T.max,k);
  if(T.start && k<3){ if(!T.stopAt) T.stopAt=now; else if(now-T.stopAt>10*60*1000 && T.dist>0.3) tripEnd(); }
  else T.stopAt=null;
  if(now-tripSaveT>15000){ tripSaveT=now; S.trip=T; save(); }
  renderTrip();
}
function tripEnd(silent){
  if(T.dist>0.2){ const avg=T.moving>0?T.dist/(T.moving/3600):0;
    S.trips.unshift({d:Date.now(),km:+T.dist.toFixed(1),min:Math.round(T.moving/60),avg:Math.round(avg),max:Math.round(T.max)}); S.trips=S.trips.slice(0,20); }
  T=tripNew(); S.trip=T; save(); renderTrip(); if(!silent) toast('Viaggio salvato');
}

}

const NAV={dest:null,route:null,geom:null,cum:[],steps:[],active:false,si:0,off:0,lastRe:0,nextDist:null,said:{},snap:null,busy:false};
async function fetchRoute(from,to){
  const u='https://router.project-osrm.org/route/v1/driving/'+from.lon.toFixed(6)+','+from.lat.toFixed(6)+';'+to.lon.toFixed(6)+','+to.lat.toFixed(6)+'?overview=full&geometries=geojson&steps=true';
  const j=await getJSON(u,15000);
  if(!j.routes||!j.routes.length) throw new Error('no route');
  const r=j.routes[0], g=r.geometry.coordinates, cum=[0];
  for(let i=1;i<g.length;i++) cum.push(cum[i-1]+kmBetween({lat:g[i-1][1],lon:g[i-1][0]},{lat:g[i][1],lon:g[i][0]})*1000);
  let gi=0;
  const steps=(r.legs[0].steps||[]).map(s=>{ const L=s.maneuver.location; let best=gi,bd=1e9;
      for(let i=gi;i<Math.min(g.length,gi+4000);i++){ const d=Math.abs(g[i][0]-L[0])+Math.abs(g[i][1]-L[1]); if(d<bd){bd=d;best=i;} if(bd<1e-7) break; }
      gi=best; return {type:s.maneuver.type,mod:s.maneuver.modifier||'',exit:s.maneuver.exit,name:s.name||'',ref:s.ref||'',dist:s.distance,idx:best,at:cum[best]}; });
  NAV.route={dist:r.distance,dur:r.duration}; NAV.geom=g; NAV.cum=cum; NAV.steps=steps; NAV.si=0; NAV.off=0; NAV.said={};
}

const MOD={'left':'a sinistra','right':'a destra','slight left':'leggermente a sinistra','slight right':'leggermente a destra','sharp left':'tutto a sinistra','sharp right':'tutto a destra','straight':'dritto','uturn':'con un’inversione a U'};
function instr(s){
  const m=MOD[s.mod]||'', on=s.name?(' su '+s.name):(s.ref?' su '+s.ref:'');
  switch(s.type){
    case 'arrive': return 'arrivo a destinazione'+(s.mod==='left'?', sulla sinistra':s.mod==='right'?', sulla destra':'');
    case 'depart': return 'parti'+on;
    case 'roundabout': case 'rotary': return 'alla rotonda prendi la '+(s.exit?s.exit+'ª ':'')+'uscita'+on;
    case 'exit roundabout': case 'exit rotary': return 'esci dalla rotonda'+on;
    case 'merge': return 'immettiti '+(m||'')+on;
    case 'on ramp': return 'prendi la rampa '+(m||'')+on;
    case 'off ramp': return 'prendi l’uscita '+(m||'')+on;
    case 'fork': return 'al bivio tieni '+(m||'')+on;
    case 'end of road': return 'alla fine della strada svolta '+m+on;
    case 'continue': case 'new name': return (s.mod&&s.mod!=='straight'?'continua '+m:'prosegui dritto')+on;
    default: return (s.mod==='straight'?'prosegui dritto':s.mod==='uturn'?'fai inversione a U':'svolta '+m)+on;
  }
}
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
function manIcon(s){
  if(s.type==='arrive') return svg('flag');
  if(s.type==='roundabout'||s.type==='rotary') return svg('round');
  if(s.mod==='uturn') return svg('uturn');
  const a={'straight':0,'slight right':40,'right':90,'sharp right':135,'slight left':-40,'left':-90,'sharp left':-135}[s.mod]||0;
  return svg('up','transform:rotate('+a+'deg)');
}
NAV.update=function(first){
  if(!NAV.active||!NAV.geom||!pos) return;
  const g=NAV.geom, z=17, px=lon2x(pos.lon,z), py=lat2y(pos.lat,z), mpp=156543*Math.cos(pos.lat*Math.PI/180)/Math.pow(2,z);
  let best=-1,bd=1e18,bt=0;
  const from=first?0:Math.max(0,NAV.si-5), to=first?g.length-1:Math.min(g.length-1,NAV.si+400);
  for(let i=from;i<to;i++){ const ax=lon2x(g[i][0],z),ay=lat2y(g[i][1],z),bx=lon2x(g[i+1][0],z),by=lat2y(g[i+1][1],z);
    const vx=bx-ax,vy=by-ay,l2=vx*vx+vy*vy; let t=l2?((px-ax)*vx+(py-ay)*vy)/l2:0; t=Math.max(0,Math.min(1,t));
    const dx=ax+t*vx-px, dy=ay+t*vy-py, d=dx*dx+dy*dy; if(d<bd){bd=d;best=i;bt=t;} }
  if(best<0) return;
  const offM=Math.sqrt(bd)*mpp;
  const segLen=NAV.cum[best+1]-NAV.cum[best];
  const along=NAV.cum[best]+bt*segLen;
  if(offM>Math.max(45,Math.min(pos.acc||0,120))){ NAV.off++; }
  else { NAV.off=0; NAV.si=best; NAV.along=along;
    const ax=lon2x(g[best][0],M.z),ay=lat2y(g[best][1],M.z),bx=lon2x(g[best+1][0],M.z),by=lat2y(g[best+1][1],M.z);
    NAV.snap={x:ax+bt*(bx-ax)-M.ox,y:ay+bt*(by-ay)-M.oy}; }
  if(NAV.along==null) NAV.along=along;
  if(NAV.off>=3 && Date.now()-NAV.lastRe>15000 && !NAV.busy){ reroute(); return; }
  const remain=Math.max(0,NAV.route.dist-NAV.along);
  if(remain<30){ say('Sei arrivato a destinazione'); toast('Sei arrivato'); cancelRoute(); return; }
  let k=NAV.steps.findIndex((s,i)=>i>0 && s.at>NAV.along+3); if(k<0) k=NAV.steps.length-1;
  const st=NAV.steps[k], dist=Math.max(0,st.at-NAV.along); NAV.nextDist=dist;
  $('#manIco').innerHTML=manIcon(st); $('#manDist').textContent=fmtDist(dist); $('#manText').textContent=cap(instr(st));
  const nn=NAV.steps[k+1];
  if(nn && nn.at-st.at<350 && st.type!=='arrive'){ $('#manThen').style.display='flex'; $('#manThen').innerHTML='Poi '+manIcon(nn)+esc(instr(nn)); } else $('#manThen').style.display='none';
  const remDur=NAV.route.dur*(remain/NAV.route.dist);
  $('#nbEta').textContent=hm(new Date(Date.now()+remDur*1000)); $('#nbMin').textContent=fmtDur(remDur); $('#nbKm').textContent=fmtDist(remain);
  const far=pos.kmh>80?1500:600, near=pos.kmh>80?200:90, key=k+'';
  if(dist<=far && dist>near*2 && !NAV.said[key+'f'] && st.dist!==0){ NAV.said[key+'f']=1; say('Tra '+spokenDist(dist)+', '+instr(st)); }
  else if(dist<=near && !NAV.said[key+'n']){ NAV.said[key+'n']=1; NAV.said[key+'f']=1; say(cap(instr(st))+(nn && nn.at-st.at<200 && nn.type!=='arrive'?', poi '+instr(nn):'')); }
};

/* ================= meteo e notte ================= */
const WX=[[0,'☀️','Sereno'],[2,'🌤️','Poco nuvoloso'],[3,'☁️','Nuvoloso'],[48,'🌫️','Nebbia'],[57,'🌦️','Pioviggine'],[67,'🌧️','Pioggia'],[77,'❄️','Neve'],[82,'🌧️','Rovesci'],[86,'🌨️','Neve'],[99,'⛈️','Temporale']];
let sun=null, wxNow=null;
function weather(lat,lon){
  getJSON('https://api.open-meteo.com/v1/forecast?latitude='+lat.toFixed(3)+'&longitude='+lon.toFixed(3)+'&current=temperature_2m,weather_code,is_day&daily=sunrise,sunset&forecast_days=1&timezone=auto')
   .then(j=>{ const t=Math.round(j.current.temperature_2m), c=j.current.weather_code, w=WX.find(x=>c<=x[0])||WX[0];
     const ic=(j.current.is_day===0&&c<=2)?'🌙':w[1]; wxNow={t:t,desc:w[2]};
     $('#wxIcon').textContent=ic; $('#wxTemp').textContent=t+'°'; $('#wxDesc').textContent=w[2]; $('#sideTemp').textContent=ic+' '+t+'°';
     if(j.daily&&j.daily.sunrise){ sun={rise:new Date(j.daily.sunrise[0]).getTime(),set:new Date(j.daily.sunset[0]).getTime()}; applyNight(); } }).catch(()=>{});
}
function isNight(){
  if(S.night==='on') return true; if(S.night==='off') return false;
  const n=Date.now();
  if(sun&&!isNaN(sun.rise)&&new Date(sun.rise).toDateString()===new Date().toDateString()) return n<sun.rise||n>sun.set;
  const h=new Date().getHours(); return h>=19||h<7;
}
function applyNight(){
  const n=isNight(); document.body.classList.toggle('night',n); document.body.classList.toggle('day',!n); document.body.classList.toggle('dim',!!S.dim);
  const st=n?'night':'day'; if(st!==M.style){ M.style=st; if(GM.on) gmStyle(); else if(current==='dash') mapReset(); }
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('#micBtn span').innerHTML=svg('mic','width:28px;height:28px');
let rec=null, vTimer=null;
function vShow(t,hint,idle){ const v=$('#voice'); v.classList.add('on'); v.classList.toggle('idle',!!idle); $('#vText').textContent=t; $('#vHint').innerHTML=hint||''; clearTimeout(vTimer); }
function vHide(ms){ clearTimeout(vTimer); vTimer=setTimeout(()=>$('#voice').classList.remove('on'),ms||0); }

const HINT='Prova: “portami a casa”, “vai in via Roma 10 Milano”, “chiama Marco”, “benzina”, “metti Spotify”, “dove ho parcheggiato”';
$('#micBtn').onclick=()=>{
  audio();
  if(!SR){ vShow('Comandi vocali non disponibili','Safari su questo iPad non permette il riconoscimento vocale alle pagine web. Puoi usare “Ehi Siri”, oppure il microfono della tastiera nella barra di ricerca.',true); vHide(6000); return; }
  try{ rec=new SR(); }catch(e){ return; }
  rec.lang='it-IT'; rec.interimResults=true; rec.maxAlternatives=1; rec.continuous=false;
  let done=false;
  vShow('Ti ascolto…',HINT);

    $('#vText').textContent='“'+t.trim()+'”';
    if(e.results[e.results.length-1].isFinal && !done){ done=true; handleVoice(t); } };
  rec.onerror=e=>{ if(done) return; done=true; vShow(e.error==='not-allowed'?'Microfono non consentito':'Non ho sentito bene', e.error==='not-allowed'?'Consenti il microfono a Safari nelle Impostazioni dell’iPad.':'Tocca di nuovo il microfono e riprova.',true); vHide(3500); };
  rec.onend=()=>{ if(!done){ vShow('Non ho sentito nulla','Tocca il microfono e parla subito dopo.',true); vHide(2500); } };

function reply(t,ms){ vShow(t,'',true); say(t,true); vHide(ms||2200); }
function findContact(n){ n=n.toLowerCase().trim(); const f=S.contacts.find(c=>c.name.toLowerCase()===n)||S.contacts.find(c=>c.name.toLowerCase().includes(n)||n.includes(c.name.toLowerCase())); if(f) return f;
  const b=(S.book||[]).find(c=>c.n.toLowerCase()===n)||(S.book||[]).find(c=>c.n.toLowerCase().includes(n)); return b?{name:b.n,num:b.nums[0].v}:null; }
async function handleVoice(raw){
  const s=raw.toLowerCase().replace(/[.,!?]/g,'').trim(); let m;
  if(/(termina|ferma|chiudi|annulla).*(navigazione|percorso)|^stop$/.test(s)){ cancelRoute(); return reply('Navigazione terminata'); }
  if(/(dove ho parcheggiato|torna(re)? all.?auto|dov.? (è|e) la macchina|dov.? (è|e) l.?auto)/.test(s)){ if(!S.parked) return reply('Non ho salvato nessun parcheggio'); reply('Ti porto all’auto'); return openURL(NAVS[S.nav].ll(S.parked.lat,S.parked.lon,'walking')); }
  if(/(salva|ricorda).*(parcheggio|auto|macchina)|ho parcheggiato/.test(s)){ if(!pos) return reply('Non ho ancora la posizione'); S.parked={lat:+pos.lat.toFixed(6),lon:+pos.lon.toFixed(6),time:hm(new Date())}; save(); renderDash(); return reply('Parcheggio salvato'); }
  if(/\b(a|verso) casa\b|^casa$|torn\w* a casa/.test(s)){ reply('Andiamo a casa'); return goFav(favList()[0],true); }
  if(/\b(al|in) (lavoro|ufficio)\b|^lavoro$/.test(s)){ reply('Andiamo al lavoro'); return goFav(favList()[1],true); }
  if((m=s.match(/^(?:chiama|telefona a|telefona|fai una chiamata a)\s+(.+)$/))){ const c=findContact(m[1]); if(!c) return reply('Non trovo '+m[1]+' tra i preferiti'); reply('Chiamo '+c.name); return call(c.num); }
  if((m=s.match(/^(?:scrivi a|scrivi|manda un messaggio a|messaggio a|invia un messaggio a)\s+(.+)$/))){ const c=findContact(m[1]); if(!c) return reply('Non trovo '+m[1]+' tra i preferiti'); reply('Scrivo a '+c.name); return sms(c.num); }
  if(/benzina|distributor|carburante|gasolio/.test(s)){ reply('Cerco distributori vicini'); return openURL(NAVS[S.nav].q('distributore di benzina')); }
  if(/ricarica|colonnin/.test(s)){ reply('Cerco colonnine vicine'); return openURL(NAVS[S.nav].q('colonnina di ricarica')); }
  if(/parcheggi/.test(s)){ reply('Cerco parcheggi vicini'); return openURL(NAVS[S.nav].q('parcheggio')); }
  if(/ristorant|mangiare|pizzeria|bar\b|caff/.test(s)){ reply('Cerco dove mangiare'); return openURL(NAVS[S.nav].q(/caff|bar\b/.test(s)?'bar caffè':'ristorante')); }
  if(/che ore sono|che ora è|che ora e/.test(s)) return reply('Sono le '+hm(new Date()));
  if(/che tempo|meteo|temperatura/.test(s)) return reply(wxNow?wxNow.desc+', '+wxNow.t+' gradi':'Il meteo non è ancora disponibile');
  if((m=s.match(/^(?:apri|metti|avvia|lancia|fai partire)\s+(?:la |il |lo |l.)?(.+)$/))){
    const n=m[1].replace(/^(musica su|app)\s+/,'').trim();
    const a=allApps().find(x=>x.name.toLowerCase()===n)||allApps().find(x=>x.name.toLowerCase().includes(n)||n.includes(x.name.toLowerCase()));
    if(a){ reply('Apro '+a.name,1500); return launch(a); }
    if(/musica|canzon/.test(n)){ reply('Apro Musica',1500); return launch(appById('music')); }
    return reply('Non trovo l’app '+n);
  }
  if((m=s.match(/^(?:portami|vai|andiamo|naviga|navigazione|guidami|percorso)\s+(?:verso|fino|per)?\s*(?:a|al|alla|allo|all|ai|agli|alle|in|da|dal|dalla|a\s+)?\s*(.+)$/))){
    const q=m[1].trim(); vShow('Cerco '+q+'…','',true);
    const f=favList().find(x=>x.name.toLowerCase()===q && x.addr); if(f){ reply('Andiamo a '+f.name); return goFav(f,true); }
    const r=await geocode(q); if(!r) return reply('Non trovo '+q);
    reply('Andiamo a '+r.name,2600); show('dash'); return preview(r,true);
  }
  reply('Non ho capito. '+'Prova a dire “portami a” e un indirizzo',3500);
}

const vcfIn=document.createElement('input'); vcfIn.type='file'; vcfIn.id='vcfIn'; vcfIn.accept='.vcf,text/vcard,text/x-vcard'; vcfIn.style.display='none'; document.body.appendChild(vcfIn);
vcfIn.onchange=()=>{ const f=vcfIn.files&&vcfIn.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ const list=parseVcf(String(rd.result||'')); vcfIn.value=''; addToBook(list); };
  rd.readAsText(f); };
function bindImport(){ const a=$('#impPick'), b=$('#impFile'), c=$('#impHelp'); if(a) a.onclick=pickContacts; if(b) b.onclick=()=>vcfIn.click(); if(c) c.onclick=importHelp; }
function importHelp(){ choose('Come portare i contatti in iCar',[['Ho capito','blue',()=>{}]],
  'Modo 1 – Scegli dai Contatti: si apre la rubrica dell’iPad e tocchi i contatti da portare. Se iCar dice che non è disponibile, attivalo una volta: Impostazioni dell’iPad → App → Safari → Avanzate → Feature Flags → “Contact Picker API”. Modo 2 – File .vcf: nell’app Contatti dell’iPad tieni premuto un elenco (es. “Tutti i contatti”) → Esporta → Salva su File; poi in iCar tocca “Importa file dei contatti” e scegli quel file.'); }
async function pickContacts(){
  if(!('contacts' in navigator) || !navigator.contacts.select){ return importHelp(); }
  try{ const res=await navigator.contacts.select(['name','tel'],{multiple:true});
    addToBook((res||[]).map(c=>({n:(c.name&&c.name[0])||(c.tel&&c.tel[0])||'Senza nome',nums:(c.tel||[]).map(v=>({v:String(v).trim(),l:''}))}))); }
  catch(e){ toast('Selezione annullata'); }
}
function parseVcf(txt){
  const out=[]; txt=txt.replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'');
  txt.split(/BEGIN:VCARD/i).slice(1).forEach(card=>{
    let n='', fn='', nums=[];
    card.split(/\r?\n/).forEach(line=>{
      const m=line.match(/^(?:item\d+\.)?([A-Z-]+)((?:;[^:]*)?):(.*)$/i); if(!m) return;
      const key=m[1].toUpperCase(), params=m[2].toUpperCase(), val=m[3].replace(/\\,/g,',').replace(/\;/g,';').replace(/\\n/gi,' ').trim();
      if(key==='FN') fn=val;
      else if(key==='N' && !n){ const p=val.split(';'); n=[p[1],p[0]].filter(Boolean).join(' ').trim(); }
      else if(key==='TEL'){ const t=(params.match(/(CELL|MOBILE|IPHONE|HOME|WORK|MAIN|OTHER)/)||[])[1]; const v=val.replace(/^tel:/i,''); if(v) nums.push({v:v,l:TYPE[t]||''}); }
    });
    const name=(fn||n||'').trim();
    if(nums.length) out.push({n:name||nums[0].v,nums:nums});
  });
  return out;
}
function addToBook(list){
  list=list.filter(x=>x.nums&&x.nums.length);
  if(!list.length) return toast('Nessun contatto con numero di telefono');
  const B=S.book||[]; let added=0;
  list.forEach(x=>{ const ex=B.find(b=>b.n.toLowerCase()===x.n.toLowerCase());
    if(ex){ x.nums.forEach(nn=>{ if(!ex.nums.some(o=>normNum(o.v)===normNum(nn.v))) ex.nums.push(nn); }); }
    else { B.push(x); added++; } });
  B.sort((a,b)=>a.n.localeCompare(b.n,'it',{sensitivity:'base'}));
  S.book=B; save(); phTab='book'; renderPhone(); toast(added+' contatti importati');
}
function addContact(){ ask('Nuovo contatto preferito',[{ph:'Nome'},{ph:'Numero di telefono',type:'tel'}],v=>{
  if(v[0].trim()&&v[1].trim()){ S.contacts.push({name:v[0].trim(),num:v[1].trim()}); save(); if(current==='phone') renderPhone(); else renderSettings(); } }); }
$('#kpGrid').innerHTML=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']]
  .map(k=>'<button class="key" data-k="'+k[0]+'">'+k[0]+'<small>'+k[1]+'</small></button>').join('');
$('#kpGrid').querySelectorAll('.key').forEach(b=>{ let t;
  b.onpointerdown=()=>{ t=setTimeout(()=>{ if(b.dataset.k==='0'){ kp+='+'; $('#kpNum').textContent=kp; t=null; } },600); };
  b.onclick=()=>{ if(t===null) return; clearTimeout(t); kp+=b.dataset.k; $('#kpNum').textContent=kp; }; });
$('#kpCall').innerHTML=svg('phone'); $('#kpCall').onclick=()=>call(kp);
$('#kpDel').onclick=()=>{ kp=kp.slice(0,-1); $('#kpNum').textContent=kp; };

/* ================= catalogo app ================= */
function openCatalog(){ $('#cat').classList.add('on'); $('#catSearch').value=''; renderCatalog(); }
$('#catDone').onclick=()=>{ $('#cat').classList.remove('on'); if(S.layout==='apps') renderAppsPanel(); if(current==='home') renderHome(); if(current==='settings') renderSettings(); };
$('#catSearch').oninput=renderCatalog;
function renderCatalog(){
  const q=$('#catSearch').value.trim().toLowerCase(); let h='';
  CATALOG.forEach(([cat,apps])=>{
    const list=apps.filter(a=>!q||a[0].toLowerCase().includes(q)); if(!list.length) return;
    h+='<div class="gtitle">'+esc(cat)+'</div><div class="catGrid">'+list.map(a=>{ const inn=S.custom.some(c=>c.url===a[1])||BUILTIN.some(b=>b.act.url===a[1]&&!S.hidden.includes(b.id));
      return '<button class="catItem press'+(inn?' in':'')+'" data-u="'+esc(a[1])+'"><span class="mini" style="background:'+(G[a[3]]||G.gray)+(a[3]==='white'?';color:#1c1c1e':'')+'">'+gly(a[2])+'</span><b>'+esc(a[0])+'</b><span class="add">'+svg(inn?'check':'plus')+'</span></button>'; }).join('')+'</div>';
  });
  h+='<div class="gtitle">Qualsiasi altra app</div><div class="group glass">'+
    '<div class="row"><label>Tramite Comandi rapidi <small><br>Funziona con <b>tutte</b> le app dell’iPad: crea un comando con l’azione “Apri app”, poi scrivi qui il suo nome.</small></label><button class="btn blue" id="catSc">+ Comando</button></div>'+
    '<div class="row"><label>Con il link dell’app <small><br>Per chi conosce lo “schema URL” (es. <b>instagram://</b>)</small></label><button class="btn" id="catUrl">+ Link</button></div></div>';
  $('#catBody').innerHTML=h;
  $('#catBody').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{
    const u=b.dataset.u, a=CATALOG.flatMap(c=>c[1]).find(x=>x[1]===u);
    const bi=BUILTIN.find(x=>x.act.url===u), ci=S.custom.findIndex(c=>c.url===u);
    if(bi){ if(S.hidden.includes(bi.id)) S.hidden=S.hidden.filter(x=>x!==bi.id); else S.hidden.push(bi.id); }
    else if(ci>=0) S.custom.splice(ci,1);
    else { S.custom.push({id:'c'+Date.now(),name:a[0],url:u,icon:a[2],color:a[3]}); toast(a[0]+' aggiunta alla schermata delle app'); }
    save(); renderCatalog(); });
  $('#catSc').onclick=addShortcutApp; $('#catUrl').onclick=addUrlApp;
}
function addShortcutApp(){ ask('App tramite Comando rapido',[{ph:'Nome da mostrare (es. Netflix)'},{ph:'Nome esatto del comando (es. Apri Netflix)'}],v=>{
  const n=v[0].trim(), sc=(v[1]||v[0]).trim(); if(!n||!sc) return;
  const cols=['indigo','purple','blue','teal','orange','pink'];
  S.custom.push({id:'c'+Date.now(),name:n,url:'shortcuts://run-shortcut?name='+enc(sc),icon:'layers',color:cols[S.custom.length%cols.length]}); save();
  toast(n+' aggiunta'); if($('#cat').classList.contains('on')) renderCatalog(); else renderSettings(); },'Aggiungi','Sull’iPad: Comandi rapidi → + → azione “Apri app” → scegli l’app → dai un nome al comando.'); }
function addUrlApp(){ ask('App con link',[{ph:'Nome (es. Instagram)'},{ph:'Link (es. instagram://)'}],v=>{
  let u=v[1].trim(); if(!v[0].trim()||!u) return; if(!/^[a-z][a-z0-9+.-]*:/i.test(u)) u=u.replace(/[^a-z0-9+.-]/gi,'')+'://';
  S.custom.push({id:'c'+Date.now(),name:v[0].trim(),url:u,icon:'link',color:'gray'}); save(); if($('#cat').classList.contains('on')) renderCatalog(); else renderSettings(); }); }

/* ================= finestre ================= */
function ask(title,fields,cb,okLabel,text){
  const box=$('#modalBox');
  box.innerHTML='<h4>'+esc(title)+'</h4>'+(text?'<p>'+esc(text)+'</p>':'')+fields.map((f,i)=>'<input id="mf'+i+'" type="'+(f.type||'text')+'" placeholder="'+esc(f.ph)+'" value="'+esc(f.val||'')+'">').join('')+
    '<div class="acts"><button class="btn" id="mCancel">Annulla</button><button class="btn blue" id="mOk">'+(okLabel||'Salva')+'</button></div>';
  $('#modal').classList.add('on'); setTimeout(()=>{ const f=$('#mf0'); if(f) f.focus(); },50);
  $('#mCancel').onclick=()=>$('#modal').classList.remove('on');
  $('#mOk').onclick=()=>{ const v=fields.map((_,i)=>$('#mf'+i).value); $('#modal').classList.remove('on'); cb(v); };
}
function choose(title,opts,text){
  const box=$('#modalBox');
  box.innerHTML='<h4>'+esc(title)+'</h4>'+(text?'<p>'+esc(text)+'</p>':'')+opts.map((o,i)=>'<button class="pbtn '+o[1]+' press" data-o="'+i+'" style="display:block;width:100%;margin-bottom:10px'+(o[1]==='red'?';color:var(--red)':'')+'">'+esc(o[0])+'</button>').join('')+
    '<button class="pbtn" id="mCancel" style="display:block;width:100%;background:none;color:var(--dim)">Annulla</button>';
  box.querySelectorAll('.pbtn.red').forEach(b=>b.classList.remove('red'));
  $('#modal').classList.add('on'); $('#mCancel').onclick=()=>$('#modal').classList.remove('on');
  box.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ $('#modal').classList.remove('on'); opts[+b.dataset.o][2](); });
}

/* ================= impostazioni ================= */
function sw(id,on){ return '<label class="sw"><input type="checkbox" id="'+id+'"'+(on?' checked':'')+'><span></span></label>'; }
const sel=(id,opts,val)=>'<select id="'+id+'">'+opts.map(o=>'<option value="'+o[0]+'"'+(String(val)===String(o[0])?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>';
function renderSettings(){
  const apps=allApps(); let h='';
  h+='<div class="gtitle">Navigazione</div><div class="group glass">';
  h+='<div class="row"><label>Navigatore esterno<br><small>Per benzina, parcheggi, “Apri in…” e percorsi a piedi</small></label>'+sel('sNav',Object.keys(NAVS).map(k=>[k,NAVS[k].name]),S.nav)+'</div>';
  h+='<div class="row"><span class="mini" style="background:'+G.blue+'">'+gly('house')+'</span><label>Casa</label><input type="text" id="sHome" value="'+esc(S.home)+'" placeholder="Indirizzo di casa"></div>';
  h+='<div class="row"><span class="mini" style="background:'+G.orange+'">'+gly('brief')+'</span><label>Lavoro</label><input type="text" id="sWork" value="'+esc(S.work)+'" placeholder="Indirizzo del lavoro"></div>';
  S.places.forEach((p,i)=>{ h+='<div class="row"><span class="mini" style="background:'+G.yellow+'">'+gly('star')+'</span><label>'+esc(p.name)+'<br><small>'+esc(p.addr)+'</small></label><button class="btn red" data-delp="'+i+'">Elimina</button></div>'; });
  h+='<div class="row"><label>Altri luoghi preferiti</label><button class="btn" id="addPlace">+ Aggiungi luogo</button></div>';
  h+='<div class="row"><label>Istruzioni vocali del navigatore</label>'+sw('sVoice',S.voice)+'</div></div>';

  h+='<div class="gtitle">Guida</div><div class="group glass">';
  h+='<div class="row"><label>All’apertura mostra</label>'+sel('sStart',[['dash','Mappa'],['home','App']],S.start)+'</div>';
  h+='<div class="row"><label>Schermata della mappa<br><small>Si cambia anche col tasto sotto lo zoom</small></label>'+sel('sLay',LAYS.map(x=>[x[0],x[2]]),S.layout||'wgt')+'</div>';
  h+='<div class="row"><label>Avviso di velocità<br><small>Puoi cambiarlo anche toccando il tachimetro</small></label>'+sel('sLimit',[0,30,50,70,90,110,130].map(v=>[v,v?'Oltre '+v+' km/h':'Spento']),S.limit)+'</div>';
  h+='<div class="row"><label>Suono di avviso</label>'+sw('sBeep',S.beep)+'</div></div>';

  h+='<div class="gtitle">Computer di bordo · ultimi viaggi</div><div class="group glass">';
  if(!S.trips.length) h+='<div class="row"><label style="color:var(--dim)">Nessun viaggio salvato. Un viaggio si salva da solo dopo 10 minuti da fermo, o con “Nuovo viaggio”.</label></div>';
  S.trips.slice(0,10).forEach(t=>{ const d=new Date(t.d); h+='<div class="row"><span class="mini" style="background:'+G.indigo+'">'+gly('route')+'</span><label>'+d.getDate()+'/'+(d.getMonth()+1)+' alle '+hm(d)+'<br><small>'+String(t.km).replace('.',',')+' km · '+t.min+' min · media '+t.avg+' km/h · max '+t.max+' km/h</small></label></div>'; });
  if(S.trips.length) h+='<div class="row"><label>Cancella lo storico</label><button class="btn red" id="clrTrips">Cancella</button></div>';
  h+='</div>';


  h+='<div class="gtitle">Telefono</div><div class="group glass">';
  h+='<div class="row"><label>Chiama con</label>'+sel('sCall',[['tel','Telefono (tramite iPhone)'],['facetime','FaceTime audio']],S.call)+'</div>';
  S.contacts.forEach((c,i)=>{ h+='<div class="row"><span class="mini" style="background:'+G.gray+'">'+gly('user')+'</span><label>'+esc(c.name)+'<br><small>'+esc(c.num)+'</small></label><button class="btn red" data-delc="'+i+'">Elimina</button></div>'; });
  h+='<div class="row"><label>Contatti preferiti</label><button class="btn" id="addC">+ Aggiungi contatto</button></div>';
  h+='<div class="row"><label>Contatti importati<br><small>'+(S.book||[]).length+' contatti salvati su questo iPad</small></label><button class="btn" id="goBook">Gestisci</button></div>';
  h+='<div class="row"><label>Comando per aprire l’app Telefono<br><small>Nome del Comando rapido con “Apri app → Telefono” (di solito “Apri Telefono”)</small></label><input type="text" id="sPhSc" value="'+esc(S.phoneSc||'')+'" placeholder="es. Apri Telefono"></div></div>';

  h+='<div class="gtitle">App</div><div class="note">Accendi o spegni le app, cambia l’ordine con le frecce. Con “Aggiungi app” scegli tra decine di app o colleghi qualsiasi app tramite Comandi rapidi.</div><div class="group glass">';
  h+='<div class="row"><label><b>Aggiungi app</b></label><button class="btn blue" id="openCat">Scegli app</button></div>';
  apps.forEach((a,i)=>{
    h+='<div class="row"><span class="mini" style="background:'+(G[a.color]||G.gray)+(a.color==='white'?';color:#1c1c1e':'')+'">'+gly(a.icon)+'</span><label>'+esc(a.name)+'</label>'+
      '<button class="btn" data-up="'+i+'"'+(i===0?' disabled style="opacity:.3"':'')+'>▲</button><button class="btn" data-dn="'+i+'"'+(i===apps.length-1?' disabled style="opacity:.3"':'')+'>▼</button>'+
      (a.custom?'<button class="btn red" data-delapp="'+a.id+'">Elimina</button>':'')+(a.id==='set'?'':sw('vis_'+a.id,!S.hidden.includes(a.id)))+'</div>'; });
  h+='</div>';
  h+='<div class="gtitle">Riquadro “Audio e app” della mappa</div><div class="group glass">';
  [0,1,2,3].forEach(i=>{ h+='<div class="row"><label>Tasto '+(i+1)+'</label>'+sel('sAud'+i,apps.filter(a=>!['set','addapp','dash'].includes(a.id)).map(a=>[a.id,a.name]),S.audio[i]||'')+'</div>'; });
  h+='</div>';

  h+='<div class="gtitle">Schermo</div><div class="group glass">';
  h+='<div class="row"><label>Sfondo</label><div class="wps">'+Object.keys(WALL).map(k=>'<button data-wall="'+k+'" class="'+(S.wall===k?'on':'')+'" style="background:linear-gradient(160deg,'+WALL[k][0]+','+WALL[k][1]+')" aria-label="'+k+'"></button>').join('')+'</div></div>';
  h+='<div class="row"><label>Orologio 24 ore</label>'+sw('s24',S.h24)+'</div>';
  h+='<div class="row"><label>Tieni lo schermo acceso</label>'+sw('sWake',S.wake)+'</div>';
  h+='<div class="row"><label>Mappa scura (notte)</label>'+sel('sNight',[['auto','Dopo il tramonto'],['on','Sempre'],['off','Mai']],S.night)+'</div>';
  h+='<div class="row"><label>Di notte abbassa la luminosità</label>'+sw('sDim',S.dim)+'</div>';
  h+='<div class="row"><label>Chiave Google Maps<br><small>Con la tua chiave la mappa principale diventa Google Maps, con vista normale e satellite. Lascia vuoto per OpenStreetMap.</small></label><input type="text" id="sGKey" value="'+esc(S.gKey||'')+'" placeholder="Incolla la chiave Google" autocapitalize="off" autocorrect="off" spellcheck="false"></div>';
  h+='<div class="row"><label>Tipo di mappa Google</label>'+sel('sMtype',[['roadmap','Mappa normale'],['hybrid','Satellite']],S.mtype||'roadmap')+'</div>';
  h+='</div>';

  h+='<div class="gtitle">Ripristino</div><div class="group glass"><div class="row"><label>Riporta tutto come all’inizio</label><button class="btn red" id="reset">Ripristina</button></div></div>';
  h+='<div class="note" style="text-align:center">iCar 3.7.1 · mappe © OpenStreetMap / Google · ricerca Photon · percorsi OSRM · meteo Open-Meteo</div>';
  $('#setBody').innerHTML=h;

  const on=(id,ev,f)=>{ const e=document.getElementById(id); if(e) e[ev]=f; };
  on('sNav','onchange',e=>{S.nav=e.target.value;save();});
  on('sHome','onchange',e=>{S.home=e.target.value.trim();S.homeLL=null;save();});
  on('sWork','onchange',e=>{S.work=e.target.value.trim();S.workLL=null;save();});
  on('addPlace','onclick',()=>ask('Nuovo luogo preferito',[{ph:'Nome (es. Palestra)'},{ph:'Indirizzo'}],v=>{ if(v[0].trim()&&v[1].trim()){S.places.push({name:v[0].trim(),addr:v[1].trim()});save();renderSettings();} }));
  on('sVoice','onchange',e=>{S.voice=e.target.checked;save(); if(S.voice) say('Istruzioni vocali attive');});
  on('sStart','onchange',e=>{S.start=e.target.value;save();});
  on('sLay','onchange',e=>{S.layout=e.target.value;save();applyLayout();});
  on('sLimit','onchange',e=>{S.limit=+e.target.value;save();renderLimit();});
  on('sBeep','onchange',e=>{S.beep=e.target.checked;save(); if(S.beep) beep();});
  on('clrTrips','onclick',()=>{S.trips=[];save();renderSettings();});
  on('sCall','onchange',e=>{S.call=e.target.value;save();});
  on('addC','onclick',addContact);
  on('goBook','onclick',()=>{ phTab='book'; show('phone'); });
  on('sPhSc','onchange',e=>{S.phoneSc=e.target.value.trim();save();});
  on('openCat','onclick',openCatalog);
  [0,1,2,3].forEach(i=>on('sAud'+i,'onchange',e=>{S.audio[i]=e.target.value;save();}));
  document.querySelectorAll('[data-delp]').forEach(b=>b.onclick=()=>{S.places.splice(+b.dataset.delp,1);save();renderSettings();});
  document.querySelectorAll('[data-delc]').forEach(b=>b.onclick=()=>{S.contacts.splice(+b.dataset.delc,1);save();renderSettings();});
  document.querySelectorAll('[data-delapp]').forEach(b=>b.onclick=()=>{S.custom=S.custom.filter(c=>c.id!==b.dataset.delapp);save();renderSettings();});
  const move=(i,d)=>{ const ids=allApps().map(a=>a.id), j=i+d; [ids[i],ids[j]]=[ids[j],ids[i]]; S.order=ids; save(); renderSettings(); };
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));
  document.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>move(+b.dataset.dn,1));
  apps.forEach(a=>{ const e=document.getElementById('vis_'+a.id); if(e) e.onchange=()=>{ S.hidden=S.hidden.filter(x=>x!==a.id); if(!e.checked) S.hidden.push(a.id); save(); }; });
  document.querySelectorAll('[data-wall]').forEach(b=>b.onclick=()=>{S.wall=b.dataset.wall;save();applyWall();renderSettings();});
  on('s24','onchange',e=>{S.h24=e.target.checked;save();tick();});
  on('sWake','onchange',e=>{S.wake=e.target.checked;save();if(S.wake)requestWake();else releaseWake();});
  on('sNight','onchange',e=>{S.night=e.target.value;save();applyNight();});
  on('sDim','onchange',e=>{S.dim=e.target.checked;save();applyNight();});
  on('sGKey','onchange',e=>{ S.gKey=e.target.value.trim(); save(); toast(S.gKey?'Chiave salvata: riapro iCar con Google Maps':'Torno a OpenStreetMap'); setTimeout(()=>location.reload(),1200); });
  on('sMtype','onchange',e=>{ S.mtype=e.target.value; save(); if(GM.map) GM.map.setMapTypeId(S.mtype); renderType(); });
  on('reset','onclick',()=>ask('Ripristinare tutto? Scrivi SI per confermare',[{ph:'SI'}],v=>{ if(v[0].trim().toUpperCase()==='SI'){ S=JSON.parse(JSON.stringify(DEF)); T=tripNew(); save(); applyWall(); renderRecents(); renderSettings(); toast('Ripristinato'); } },'Conferma'));
}
function applyWall(){ const w=WALL[S.wall]||WALL.blu; document.documentElement.style.setProperty('--wp1',w[0]); document.documentElement.style.setProperty('--wp2',w[1]); }

/* ================= schermo acceso ================= */
let wl=null;
async function requestWake(){ if(!S.wake||wl||!('wakeLock' in navigator)) return; try{ wl=await navigator.wakeLock.request('screen'); wl.addEventListener('release',()=>{wl=null;}); }catch(e){ wl=null; } }
function releaseWake(){ if(wl){ try{wl.release();}catch(e){} wl=null; } }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') requestWake(); });
document.addEventListener('click',()=>{ requestWake(); if(S.beep&&S.limit) audio(); },{passive:true});

/* ================= orologio ================= */
const GIORNI=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function tick(){ const d=new Date(), t=hm(d); $('#sideClock').textContent=t; $('#clockBig').textContent=t; $('#apClock').textContent=t; $('#apDate').textContent=GIORNI[d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()];
  $('#dateBig').textContent=GIORNI[d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()]; applyNight(); }

/* ================= avvio ================= */
if('speechSynthesis' in window){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){} }
applyWall(); applyLayout(); renderType(); tick(); setInterval(tick,10000); gmLoad();
renderRecents(); show(S.start==='home'?'home':'dash');
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
window.__icar={S:S,M:M,NAV:NAV,handleVoice:handleVoice,preview:preview};
})();
</script>
